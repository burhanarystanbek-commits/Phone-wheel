name: Build PC App (exe)

on:
  push:
    branches: [ main, master, 'ccr-*' ]
    paths:
      - 'pc-app/**'
      - '.github/workflows/build-pc-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore pc-app/PhoneWheelPC.csproj --verbosity normal

      - name: Build (no publish, just compile)
        run: dotnet build pc-app/PhoneWheelPC.csproj -c Release --verbosity normal

      - name: Publish single-file exe
        run: >
          dotnet publish pc-app/PhoneWheelPC.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=2.0.${{ github.run_number }}
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneWheelPC-win64
          path: publish/PhoneWheelPC.exe
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v2.0.${{ github.run_number }}
          name: PhoneWheel PC 2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: publish/PhoneWheelPC.exe
          body: "Программа для ПК. При запуске сама проверяет и ставит новую версию."
